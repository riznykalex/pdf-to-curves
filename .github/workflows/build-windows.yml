name: Build Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - "pdf_to_curves.py"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch: {}   # дозволяє запустити вручну кнопкою "Run workflow"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: >
          pyinstaller --onefile --windowed
          --name "PDF-to-Curves"
          pdf_to_curves.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-to-Curves-windows
          path: dist/PDF-to-Curves.exe

      # Необов'язково: автоматично публікувати як GitHub Release
      # при пуші тега у форматі v1.0.0
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDF-to-Curves.exe
